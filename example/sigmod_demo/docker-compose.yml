services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus
    image: milvusdb/milvus:v2.5.3
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    links:
      - etcd
      - minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  zk:
    container_name: iginx-zookeeper
    image: zookeeper

  iginx:
    container_name: iginx
    image: iginx
    ports:
      - 6888:6888
    volumes:
      - ../../v8/src/main/resources/static/udf/Merge.py:/app/udf_funcs/python_scripts/Merge.py
      - ../../v8/src/main/resources/static/udf/StoreEmbedding.py:/app/udf_funcs/python_scripts/StoreEmbedding.py
      - ../../v8/src/main/resources/static/udf/udf_list:/app/udf_funcs/udf_list
    environment:
      zookeeperConnectionString: zk:2181
      needInitBasicUDFFunctions: true
    links:
      - zk
      - milvus

  zeppelin:
    container_name: zeppelin
    image: apache/zeppelin:0.8.2
    ports:
      - 8080:8080
    volumes:
      - ../../v8/target/zeppelin8-iginx-0.7.2-shaded.jar:/zeppelin/interpreter-iginx-only/iginx/zeppelin8-iginx-shaded.jar
      - ./notebook:/zeppelin/notebook
    environment:
      ZEPPELIN_ADDR: 0.0.0.0
      ZEPPELIN_INTERPRETER_DIR: /zeppelin/interpreter-iginx-only
    links:
      - iginx
      - milvus