<style>
    .data-property-container {
        height: 80vh;
        width: 100%;
        background-color: #f5f5f5;
        border: 1px solid #ddd;
        box-sizing: border-box;
    }
    .data-property-summary {
        display: list-item;
        cursor: pointer;
    }
</style>

<details >
    <summary class="data-property-summary">Data Property</summary>
    <div id="${paragraphId}_data_property_container" class="data-property-container"></div>
</details>

<script>
    async function loadDataPropertyGraph() {
        await import('https://unpkg.com/@antv/g6@5/dist/g6.min.js');
        const { Graph } = G6;

        fetch('https://assets.antv.antgroup.com/g6/graph.json')
          .then((res) => res.json())
          .then((data) => {
            const graph = new Graph({
              container: '${paragraphId}_data_property_container',
              autoFit: 'view',
              data,
              node: {
                style: {
                  size: 10,
                },
                palette: {
                  field: 'group',
                  color: 'tableau',
                },
              },
              layout: {
                type: 'd3-force',
                manyBody: {},
                x: {},
                y: {},
              },
              behaviors: ['drag-canvas', 'zoom-canvas', 'drag-element'],
            });

            graph.render();
          });
    }

    loadDataPropertyGraph();
</script>
